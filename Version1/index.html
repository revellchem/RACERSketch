<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RACER Sketch</title>
<link rel="stylesheet" href="sketcher.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="title">RACER Sketch</div>
    <div class="group">
      <button id="btn-undo" class="btn icon" title="Undo (Ctrl+Z)">↶</button>
      <button id="btn-redo" class="btn icon" title="Redo (Ctrl+Y)">↷</button>
      <button id="btn-clear" class="btn" title="Clear the canvas">Clear</button>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button id="btn-open" class="btn" title="Open a .mol file (or drop one on the canvas)">Open .mol</button>
      <button id="btn-analyze" class="btn" title="Molecular formula and molar mass of the selection">Analyze</button>
      <div class="sep"></div>
      <button id="btn-copy" class="btn" title="Copy the drawing to the clipboard as an image">⧉&nbsp; Copy image</button>
      <button id="btn-saveimg" class="btn" title="Download the drawing as an image">Save PNG</button>
      <button id="btn-savemol" class="btn primary" title="Download the structure as a V2000 molfile">Save .mol</button>
    </div>
    <div class="sep"></div>
    <button id="btn-options" class="btn icon" title="Options">⚙</button>
  </header>

  <nav class="rail">
    <button class="tool" data-tool="select" title="Select / lasso (V)">
      <svg viewBox="0 0 30 30"><path d="M6 12 C4 6, 14 3, 20 6 S27 16, 22 20 S10 24, 8 19" stroke="currentColor" stroke-width="1.8" fill="none" stroke-dasharray="3 2.5"/><path d="M12 23 l4 5 l1.6-2.2 l3.4 1.4 l-1.8-4 l3-1.5 z" fill="currentColor"/></svg>
      <span class="key">V</span>
    </button>
    <button class="tool" data-tool="bond" title="Bond: single / double / triple (B)">
      <svg viewBox="0 0 30 30"><line x1="6" y1="22" x2="24" y2="11.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span class="key">B</span>
    </button>
    <button class="tool" data-tool="atom" title="Atom label (X)">
      <svg viewBox="0 0 30 30"><text id="atom-el" x="15" y="13" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="currentColor">C</text><line x1="15" y1="16" x2="15" y2="27" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span class="key">X</span>
    </button>
    <button class="tool" data-tool="wedge" title="Wedge / dash bond for chirality (W)">
      <svg viewBox="0 0 30 30"><polygon points="5,24 24,8 27,13" fill="currentColor"/><line x1="8" y1="26" x2="10" y2="24" stroke="currentColor" stroke-width="1.4"/><line x1="12" y1="27" x2="15" y2="23" stroke="currentColor" stroke-width="1.4"/><line x1="16" y1="28" x2="20" y2="22" stroke="currentColor" stroke-width="1.4"/></svg>
      <span class="key">W</span>
    </button>
    <div class="rail-sep"></div>
    <button class="tool" data-tool="ring5" title="5-membered ring (5)">
      <svg viewBox="0 0 30 30"><polygon points="15,4 25.5,11.6 21.5,24 8.5,24 4.5,11.6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="key">5</span>
    </button>
    <button class="tool" data-tool="ring6" title="6-membered ring (6)">
      <svg viewBox="0 0 30 30"><polygon points="15,3.5 25,9.25 25,20.75 15,26.5 5,20.75 5,9.25" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="key">6</span>
    </button>
    <button class="tool" data-tool="benzene" title="Benzene ring (A)">
      <svg viewBox="0 0 30 30"><polygon points="15,3 25.4,9 25.4,21 15,27 4.6,21 4.6,9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><line x1="8.2" y1="10.4" x2="14.4" y2="6.8" stroke="currentColor" stroke-width="1.6"/><line x1="22.4" y1="11.4" x2="22.4" y2="18.6" stroke="currentColor" stroke-width="1.6"/><line x1="8.2" y1="19.6" x2="14.4" y2="23.2" stroke="currentColor" stroke-width="1.6"/></svg>
      <span class="key">A</span>
    </button>
    <div class="rail-sep"></div>
    <button class="tool" data-tool="arrow" title="Reaction arrow (R)">
      <svg viewBox="0 0 30 30"><line x1="4" y1="15" x2="24" y2="15" stroke="currentColor" stroke-width="2"/><path d="M19 9.5 L26 15 L19 20.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="key">R</span>
    </button>
    <button class="tool" data-tool="eq" title="Equilibrium arrow (Q)">
      <svg viewBox="0 0 30 30"><line x1="4" y1="12" x2="25" y2="12" stroke="currentColor" stroke-width="2"/><path d="M20 7.5 L25 12" fill="none" stroke="currentColor" stroke-width="2"/><line x1="5" y1="18" x2="26" y2="18" stroke="currentColor" stroke-width="2"/><path d="M10 22.5 L5 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="key">Q</span>
    </button>
    <button class="tool" data-tool="text" title="Text (T)">
      <svg viewBox="0 0 30 30"><text x="8" y="23" font-family="Georgia, serif" font-size="24" fill="currentColor">T</text></svg>
      <span class="key">T</span>
    </button>
    <div class="rail-sep"></div>
    <button class="tool" data-tool="eraser" title="Eraser (E)">
      <svg viewBox="0 0 30 30"><path d="M5 19 L16 8 L25 17 L18 24 L11 24 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="11" y1="13" x2="20" y2="22" stroke="currentColor" stroke-width="2"/></svg>
      <span class="key">E</span>
    </button>

    <div id="atom-palette" class="popover hidden">
      <div class="hdr">Atom label · click an atom to apply</div>
      <div id="palette-grid" class="elements"></div>
      <button id="palette-more" class="more">Periodic table …</button>
      <div class="hint">Shortcut: hover an atom and press <b>C H N O F L B I P S</b></div>
    </div>
  </nav>

  <main id="canvas" class="canvas">
    <svg id="sheet" xmlns="http://www.w3.org/2000/svg"></svg>
    <input id="text-editor" class="hidden" type="text" spellcheck="false" autocomplete="off">
  </main>

  <footer id="status" class="status"></footer>
</div>

<input type="file" id="file-input" accept=".mol,.sdf,.txt" hidden>

<dialog id="dlg-analyze">
  <h2>Analysis</h2>
  <div class="an-row"><span>Molecular formula</span><strong id="an-formula" class="chem"></strong></div>
  <div class="an-row"><span>Molar mass</span><strong id="an-mass"></strong></div>
  <p id="an-note" class="muted"></p>
  <div class="actions">
    <button id="an-add" class="btn primary">Add to drawing</button>
    <button id="an-copy" class="btn">Copy text</button>
    <button class="btn close">Close</button>
  </div>
</dialog>

<dialog id="dlg-options">
  <h2>Options</h2>
  <fieldset>
    <legend>Heteroatom labels</legend>
    <label><input type="radio" name="hetero" value="color"> In colour (O red, N blue, …)</label>
    <label><input type="radio" name="hetero" value="black"> Black only</label>
  </fieldset>
  <fieldset>
    <legend>Image format for “Save”</legend>
    <label><input type="radio" name="imgfmt" value="png"> PNG (sharp, transparent-safe)</label>
    <label><input type="radio" name="imgfmt" value="jpg"> JPG (smaller file)</label>
  </fieldset>
  <p class="muted">More options (font, font size, bond width) will be added here.</p>
  <div class="actions"><button class="btn primary close">Done</button></div>
</dialog>

<dialog id="dlg-ptable">
  <h2>Choose an element</h2>
  <div id="ptable-grid" class="ptable"></div>
  <div class="actions"><button class="btn close">Cancel</button></div>
</dialog>

<script src="sketcher.js"></script>
</body>
</html>
